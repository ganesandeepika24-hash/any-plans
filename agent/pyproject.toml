[project]
name = "any-plans-agent"
version = "0.1.0"
description = "Any Plans? agent service: FastAPI + LangGraph"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "langgraph>=1.2.17",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyjwt[crypto]>=2.15.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: downloads or loads the embedding model"]
