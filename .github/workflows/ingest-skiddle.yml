name: Ingest Skiddle

# Nightly at 02:00 UTC, plus manual dispatch (decision 0008). The schedule is
# allowed only while 0001 contains "Skiddle schedule: APPROVED";
# jobs/tests/test_workflow_guard.py fails CI otherwise, or if any other trigger is added.
# Scheduled runs have no inputs, so DRY_RUN is empty and the run writes. Manual
# runs keep dry_run defaulting to true.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Fetch and map only. The database connection is read-only.
        type: boolean
        default: true
      save_sample:
        description: Upload the raw pages as an artifact.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: db-writes
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # 60, not 30: an ingest that re-embeds every event (a model change, or the vectors
    # from before 009) took longer than 30.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: jobs
    env:
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed
      # Print as it happens, so the log's timestamps show which phase was slow.
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: jobs/uv.lock

      - name: Cache embedding model
        uses: actions/cache@v6
        with:
          path: .fastembed
          key: fastembed-all-MiniLM-L6-v2

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Ingest
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SKIDDLE_KEY: ${{ secrets.SKIDDLE_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
          SAVE_SAMPLE: ${{ inputs.save_sample }}
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ "$SAVE_SAMPLE" = "true" ]; then args+=(--save-sample samples); fi
          uv run python -m jobs.ingest skiddle "${args[@]}"

      - name: Upload sample
        if: always() && inputs.save_sample
        uses: actions/upload-artifact@v7
        with:
          name: skiddle-sample
          path: jobs/samples
          retention-days: 7
          if-no-files-found: ignore
