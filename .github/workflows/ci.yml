name: CI

on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "jobs/**"
      - "db/**"
      - "evals/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "agent/**"
      - "jobs/**"
      - "db/**"
      - "evals/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: agent
    env:
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: agent/uv.lock

      - name: Cache embedding model
        uses: actions/cache@v6
        with:
          path: .fastembed
          key: fastembed-all-MiniLM-L6-v2

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest

      - uses: docker/setup-buildx-action@v4

      - name: Docker build
        uses: docker/build-push-action@v7
        with:
          context: agent
          push: false
          tags: any-plans-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
