name: CI

on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "jobs/**"
      - "db/**"
      - "evals/**"
      - ".github/workflows/**"
      - "docs/decisions/0001-sources-and-terms.md"
  pull_request:
    paths:
      - "agent/**"
      - "jobs/**"
      - "db/**"
      - "evals/**"
      - ".github/workflows/**"
      - "docs/decisions/0001-sources-and-terms.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: agent
    env:
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: agent/uv.lock

      - name: Cache embedding model
        uses: actions/cache@v6
        with:
          path: .fastembed
          key: fastembed-all-MiniLM-L6-v2

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest

      - uses: docker/setup-buildx-action@v4

      - name: Docker build
        uses: docker/build-push-action@v7
        with:
          context: agent
          push: false
          tags: any-plans-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  db:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgis/postgis:17-3.6
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Container name
        run: echo "PG=${{ job.services.postgres.id }}" >> "$GITHUB_ENV"

      - name: Show image versions
        run: |
          docker exec "$PG" sh -c 'grep PRETTY_NAME /etc/os-release'
          docker exec "$PG" psql -U postgres -tAc "select version()"
          docker exec "$PG" psql -U postgres -tAc "select default_version from pg_available_extensions where name = 'postgis'"

      - name: Install pgvector
        run: |
          docker exec "$PG" sh -c 'apt-get update && apt-get install -y postgresql-17-pgvector'
          docker exec "$PG" dpkg -l postgresql-17-pgvector

      # The image's init script puts postgis in the default database, so use a fresh one.
      - name: Create database and Supabase roles
        run: |
          docker exec "$PG" createdb -U postgres -T template1 anyplans
          docker exec -i "$PG" psql -U postgres -d anyplans -X -v ON_ERROR_STOP=1 -f - < db/ci/bootstrap.sql
          echo "PSQL=docker exec -i $PG psql -U postgres -d anyplans" >> "$GITHUB_ENV"

      - name: Apply migrations
        run: db/ci/migrate.sh

      - name: Apply migrations again (skips unchanged)
        run: |
          out=$(db/ci/migrate.sh)
          echo "$out"
          if echo "$out" | grep -q ": applying"; then
            echo "a second run applied a migration again" >&2
            exit 1
          fi

      - name: Re-running each migration directly fails
        run: |
          for f in db/migrations/*.sql; do
            if $PSQL -X -v ON_ERROR_STOP=1 -1 -f - < "$f"; then
              echo "$f ran twice without error" >&2
              exit 1
            fi
          done

      - name: Load seeds twice
        run: |
          for pass in 1 2; do
            for seed in cities areas; do
              $PSQL -X -v ON_ERROR_STOP=1 -1 -f - < "db/seed/$seed.sql"
            done
          done

      - name: RLS and index tests
        run: $PSQL -X -v ON_ERROR_STOP=1 -f - < db/tests/rls_and_indexes.sql

      # Last database step: it records a probe migration 002 in the CI database.
      - name: Out-of-order apply prints a notice
        run: |
          probe=$(mktemp -d)
          cp -r db "$probe/"
          printf '%s\n' "insert into public.schema_migrations (version, filename) values ('002', '002_ci_probe.sql');" \
            > "$probe/db/migrations/002_ci_probe.sql"
          out=$("$probe/db/ci/migrate.sh")
          echo "$out"
          echo "$out" | grep -q "002_ci_probe.sql: NOTICE applying out of order, 005 is already applied"

      - name: Applied migrations are unchanged
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only --diff-filter=MDR "origin/$GITHUB_BASE_REF...HEAD" -- db/migrations)
          if [ -n "$changed" ]; then
            echo "Applied migrations were edited, renamed or deleted:" >&2
            echo "$changed" >&2
            exit 1
          fi

  jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:17-3.6
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/anyplans
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: jobs/uv.lock

      - name: Container name
        run: echo "PG=${{ job.services.postgres.id }}" >> "$GITHUB_ENV"

      - name: Install pgvector
        run: docker exec "$PG" sh -c 'apt-get update && apt-get install -y postgresql-17-pgvector'

      # Same database as the db job: Supabase roles, migrations 001 and 005, seeds.
      - name: Create test database
        run: |
          docker exec "$PG" createdb -U postgres -T template1 anyplans
          docker exec -i "$PG" psql -U postgres -d anyplans -X -v ON_ERROR_STOP=1 -f - < db/ci/bootstrap.sql
          PSQL="docker exec -i $PG psql -U postgres -d anyplans" db/ci/migrate.sh
          for seed in cities areas; do
            docker exec -i "$PG" psql -U postgres -d anyplans -X -v ON_ERROR_STOP=1 -1 -f - < "db/seed/$seed.sql"
          done

      - name: Install dependencies
        working-directory: jobs
        run: uv sync --frozen

      - name: Lint
        working-directory: jobs
        run: uv run ruff check .

      - name: Format check
        working-directory: jobs
        run: uv run ruff format --check .

      - name: Tests (fixtures only, no network; database tests against the container)
        working-directory: jobs
        run: uv run pytest -v
