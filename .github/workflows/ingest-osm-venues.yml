name: Ingest OSM venues

# Decision 0009: restaurants, bars, pubs, theatres, museums and galleries in Greater
# London, from Geofabrik's daily extract of OpenStreetMap (© OpenStreetMap contributors,
# ODbL; see 0006). Weekly on Sundays at 05:00 UTC, after the nightly jobs, plus manual
# dispatch. Scheduled runs have no inputs, so DRY_RUN and DIAGNOSE are empty and the
# run writes; jobs/tests/test_workflow_guard.py checks this. Manual runs keep dry_run
# defaulting to true.
on:
  schedule:
    - cron: "0 5 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Read the extract and count only. The database connection is read-only.
        type: boolean
        default: true
      diagnose:
        description: Print the connection's database, role, RLS status and visible counts, then stop. Always read-only; no download.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: db-writes
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: jobs
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: jobs/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Ingest OSM venues
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          DRY_RUN: ${{ inputs.dry_run }}
          DIAGNOSE: ${{ inputs.diagnose }}
        run: |
          args=()
          if [ "$DIAGNOSE" = "true" ]; then
            args+=(--dry-run --diagnose)  # never a writable connection
          elif [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          uv run python -m jobs.osm_venues "${args[@]}"
