name: Ingest OSM venues

# Decision 0009: restaurants, bars, pubs, theatres, museums and galleries in Greater
# London, from Geofabrik's daily extract of OpenStreetMap (© OpenStreetMap contributors,
# ODbL; see 0006). Manual only for now: the weekly schedule (Sundays 05:00 UTC) is
# added after the first dry run has been reviewed.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Read the extract and count only. The database connection is read-only.
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: db-writes
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: jobs
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: jobs/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Ingest OSM venues
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          uv run python -m jobs.osm_venues "${args[@]}"
