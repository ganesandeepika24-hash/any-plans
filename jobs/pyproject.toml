[project]
name = "any-plans-jobs"
version = "0.1.0"
description = "Any Plans? scheduled jobs: event ingestion and retention"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.14.1",
    "tzdata>=2026.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyyaml>=6.0",
    "ruff>=0.17.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs TEST_DATABASE_URL (a database with migrations applied)"]
